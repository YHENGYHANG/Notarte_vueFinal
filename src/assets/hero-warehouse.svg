<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-label="Warehouse shelving with boxes">
  <rect width="640" height="520" fill="#141d26"/>
  <g fill="#1d2a36"><rect x="0" y="0" width="640" height="520"/></g>
  <!-- uprights -->
  <g fill="#2f4153">
    <rect x="60" y="60" width="14" height="420"/><rect x="316" y="60" width="14" height="420"/><rect x="566" y="60" width="14" height="420"/>
  </g>
  <!-- beams -->
  <g fill="#f2b01e">
    <rect x="60" y="190" width="520" height="12"/><rect x="60" y="326" width="520" height="12"/><rect x="60" y="462" width="520" height="12"/>
  </g>
  <!-- top shelf -->
  <rect x="86" y="130" width="86" height="60" rx="3" fill="#c98e4b"/><rect x="86" y="130" width="86" height="12" fill="#e0ae72"/>
  <rect x="184" y="108" width="110" height="82" rx="3" fill="#b97f3f"/><rect x="184" y="108" width="110" height="12" fill="#d9a15f"/>
  <rect x="344" y="140" width="70" height="50" rx="3" fill="#2fa59f"/><rect x="344" y="140" width="70" height="10" fill="#4cc3bc"/>
  <rect x="426" y="118" width="120" height="72" rx="3" fill="#c98e4b"/><rect x="426" y="118" width="120" height="12" fill="#e0ae72"/>
  <!-- middle shelf -->
  <rect x="90" y="262" width="120" height="64" rx="3" fill="#2fa59f"/><rect x="90" y="262" width="120" height="10" fill="#4cc3bc"/>
  <rect x="224" y="236" width="76" height="90" rx="3" fill="#c98e4b"/><rect x="224" y="236" width="76" height="12" fill="#e0ae72"/>
  <rect x="346" y="270" width="100" height="56" rx="3" fill="#b97f3f"/><rect x="346" y="270" width="100" height="10" fill="#d9a15f"/>
  <rect x="458" y="250" width="90" height="76" rx="3" fill="#e8ecef"/><rect x="458" y="250" width="90" height="10" fill="#c3ccd5"/>
  <!-- bottom shelf -->
  <rect x="88" y="386" width="96" height="76" rx="3" fill="#b97f3f"/><rect x="88" y="386" width="96" height="12" fill="#d9a15f"/>
  <rect x="196" y="410" width="118" height="52" rx="3" fill="#c98e4b"/><rect x="196" y="410" width="118" height="10" fill="#e0ae72"/>
  <rect x="350" y="372" width="86" height="90" rx="3" fill="#2fa59f"/><rect x="350" y="372" width="86" height="12" fill="#4cc3bc"/>
  <rect x="448" y="400" width="100" height="62" rx="3" fill="#b97f3f"/><rect x="448" y="400" width="100" height="10" fill="#d9a15f"/>
  <!-- labels -->
  <g fill="#fff" opacity=".9">
    <rect x="98" y="150" width="30" height="14" rx="2"/><rect x="198" y="140" width="34" height="14" rx="2"/>
    <rect x="102" y="290" width="34" height="14" rx="2"/><rect x="236" y="270" width="26" height="14" rx="2"/>
    <rect x="102" y="418" width="30" height="14" rx="2"/><rect x="362" y="404" width="28" height="14" rx="2"/>
  </g>
  <rect x="0" y="480" width="640" height="40" fill="#101820"/>
</svg>
